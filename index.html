<div class="topbar">
    ServiceCall Desktop
</div>

<div class="page">

    <div class="card">

        <h1>
            Connect ServiceNow
        </h1>

        <p>
            Enter the ServiceNow instance you want
            ServiceCall Desktop to connect to.
        </p>

        <form id="instanceForm">

            <input id="instanceUrl" type="text" placeholder="https://dev12345.service-now.com" style="
                    width:100%;
                    padding:14px;
                    border:1px solid #ccd8d4;
                    border-radius:8px;
                    font-size:14px;
                " />

            <button class="button" type="submit">
                Save Instance
            </button>

            <button class="button" id="loginButton" type="button">
                Sign in to ServiceNow
            </button>

            <button id="openActiveCallButton">
                Open Active Call
            </button>

        </form>

        <div id="instanceMessage" style="
                margin-top:18px;
                color:#40514d;
            ">
        </div>

        <hr style="
    margin:28px 0;
    border:none;
    border-top:1px solid #e2e8e6;
">
 
<div id="recordingsSection">
 
    <div style="
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:12px;
        margin-bottom:16px;
    ">
 
        <div>
            <h2 style="margin:0 0 4px 0;">
                Recordings
            </h2>
 
            <p style="
                margin:0;
                color:#667773;
                font-size:14px;
            ">
                Your ServiceCall recording history
            </p>
        </div>
 
        <button
            class="button"
            id="refreshRecordingsButton"
            type="button"
        >
            Refresh
        </button>
 
    </div>
 
    <div
        id="recordingsMessage"
        style="
            margin-bottom:14px;
            color:#40514d;
        ">
    </div>
 
    <div id="recordingsList"></div>
 
</div>
 

    </div>

</div>

<script src="renderer.js"></script>
